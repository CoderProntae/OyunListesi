<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Tarayıcı · Oyun Sıralayıcı</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, "Segoe UI", sans-serif;
        color: #e7eaf5;
        background: #11131b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input {
        font: inherit;
      }
      button {
        color: inherit;
        background: transparent;
        border: 0;
        cursor: pointer;
        border-radius: 9px;
      }
      button:hover {
        background: #ffffff0c;
      }
      button:focus-visible {
        outline: 2px solid #b6a4fa;
        outline-offset: -2px;
      }
      button:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .brand {
        height: 32px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 18px;
        font-size: 11px;
        letter-spacing: 1.3px;
        text-transform: uppercase;
        color: #abb1c7;
      }
      .brand b {
        color: #c5b6fa;
      }
      .brand span {
        margin-left: auto;
        letter-spacing: 0;
        font-size: 11px;
      }
      #tabs {
        display: flex;
        gap: 4px;
        align-items: center;
        height: 38px;
        overflow: auto;
        padding: 0 12px;
        scrollbar-width: thin;
      }
      .tab {
        display: flex;
        align-items: center;
        flex: 0 0 190px;
        max-width: 220px;
        height: 34px;
        border: 1px solid transparent;
        border-radius: 10px 10px 0 0;
        color: #9299ae;
      }
      .tab.active {
        background: #202330;
        border-color: #333648;
        color: #ececf8;
      }
      .tab-select {
        min-width: 0;
        flex: 1;
        text-align: left;
        padding: 7px 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12px;
      }
      .tab-close {
        padding: 4px 8px;
        font-size: 16px;
        margin-right: 3px;
      }
      #new {
        font-size: 22px;
        flex: 0 0 32px;
        height: 32px;
      }
      .toolbar {
        height: 50px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 5px 12px;
        background: #202330;
        border-bottom: 1px solid #343749;
      }
      .nav {
        width: 34px;
        height: 34px;
        font-size: 20px;
      }
      #address-form {
        flex: 1;
        display: flex;
        align-items: center;
        border: 1px solid #373b51;
        background: #141620;
        border-radius: 10px;
        overflow: hidden;
        margin: 0 6px;
      }
      #security {
        font-size: 11px;
        color: #9299ae;
        padding-left: 12px;
      }
      #address {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: #f0eef8;
        height: 34px;
        padding: 0 10px;
        font-size: 13px;
      }
      #go {
        font-size: 12px;
        height: 30px;
        padding: 0 12px;
        color: #c5b6fa;
      }
      #home {
        height: calc(100vh - 148px);
        display: grid;
        place-items: center;
        text-align: center;
        background: radial-gradient(ellipse at 50% 40%, #24213c 0%, #11131b 65%);
      }
      .home-copy {
        max-width: 560px;
        padding: 40px;
      }
      .home-mark {
        font-size: 40px;
        color: #c8b5fc;
      }
      .home-copy h1 {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -1px;
        margin: 20px 0 12px;
      }
      .home-copy p {
        font-size: 14px;
        line-height: 1.8;
        color: #a1a8bd;
      }
      .shortcuts {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 28px 0;
      }
      .shortcuts button {
        border: 1px solid #343348;
        padding: 12px 16px;
        background: #ffffff04;
        font-size: 12px;
      }
      .keys {
        font-size: 11px;
        color: #828a9f;
      }
      kbd {
        font: inherit;
        background: #ffffff08;
        padding: 3px 7px;
        border-radius: 4px;
        border: 1px solid #333747;
      }
      footer {
        height: 28px;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        padding: 0 14px;
        font-size: 11px;
        background: #171923;
        border-top: 1px solid #303446;
        color: #949db2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #home[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <b>oyun sıralayıcı</b> / TARAYICI<span>Uygulama içi · ayrı web oturumu</span>
      </div>
      <div id="tabs" role="tablist" aria-label="Tarayıcı sekmeleri"></div>
      <div class="toolbar">
        <button id="back" class="nav" aria-label="Geri" title="Geri">←</button
        ><button id="forward" class="nav" aria-label="İleri" title="İleri">→</button
        ><button id="reload" class="nav" aria-label="Yenile" title="Yenile">↻</button>
        <form id="address-form">
          <span id="security"></span
          ><input
            id="address"
            aria-label="Adres veya arama"
            placeholder="Bir web adresi yaz veya ara…"
            autocomplete="off"
            spellcheck="false"
          /><button id="go" type="submit">Git ↗</button>
        </form>
      </div>
    </header>
    <main id="home">
      <div class="home-copy">
        <div class="home-mark">◎</div>
        <h1>Keşfetmeye bir sekme aç.</h1>
        <p>
          Mağazalar, rehberler ve oyun dünyası.<br />Adres çubuğuna bir site veya aramak
          istediğini yaz.
        </p>
        <div class="shortcuts">
          <button data-url="https://store.steampowered.com/">Steam</button
          ><button data-url="https://store.epicgames.com/">Epic Games</button
          ><button data-url="https://www.gog.com/">GOG</button
          ><button data-url="https://steamdb.info/">SteamDB</button>
        </div>
        <div class="keys">
          <kbd>Ctrl L</kbd> adres · <kbd>Ctrl T</kbd> yeni sekme · <kbd>Ctrl W</kbd> kapat
        </div>
      </div>
    </main>
    <footer id="status" role="status">Yeni sekme</footer>
    <script src="browser-ui.js"></script>
  </body>
</html>
